name: FSDController
options:
  bundleIdPrefix: com.trytofly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: PDJCKTW6L6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  FSDController:
    type: application
    platform: iOS
    sources:
      - FSDController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trytofly.fsdcontroller
        PRODUCT_NAME: FSDController
        PRODUCT_MODULE_NAME: FSDController
        ENABLE_TESTABILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FSD Controller
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于通过安全蓝牙连接并控制 ESP32 FSD 控制器。
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  FSDControllerTests:
    type: bundle.unit-test
    platform: iOS
    productName: FSDControllerTests
    sources:
      - FSDControllerTests
    dependencies:
      - target: FSDController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trytofly.fsdcontroller.tests
        PRODUCT_NAME: FSDControllerTests
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FSDController:
    build:
      targets:
        FSDController: all
        FSDControllerTests: [test]
    test:
      targets:
        - FSDControllerTests
